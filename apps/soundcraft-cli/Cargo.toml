[package]
name = "talkcraft-cli"
description = "TalkCraft command line: headless editing, conversion, bounce, MCP server, app control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "talkcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
soundcraft-engine.workspace = true
soundcraft-automation.workspace = true
soundcraft-audio-io.workspace = true
soundcraft-dsp.workspace = true
serde_json.workspace = true

# MP3 export builds LAME from source: autotools on macOS/Linux, the `cc` crate on Windows (MSVC).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies.soundcraft-engine]
workspace = true
features = ["mp3"]
