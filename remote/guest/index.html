<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkCraft</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f9e63">
<style>
  :root { --bg: #f4f1ea; --ink: #0b0b0c; --paper: #efe9dc; --green: #2f9e63; --dim: #6b6b6b; --red: #c0392b; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 8px 0 4px; display: flex; align-items: center; gap: 12px; }
  h1 img { width: 56px; height: 56px; border-radius: 12px; }
  p { margin: 8px 0; }
  .muted { color: var(--dim); font-size: 14px; }
  label { display: block; font-weight: 600; margin: 16px 0 6px; }
  input, select, button { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #c9c3b6; background: #fff; }
  button { background: var(--green); color: #fff; border: 0; font-weight: 600; cursor: pointer; margin-top: 16px; }
  button:disabled { opacity: .5; cursor: default; }
  button.muted-on { background: var(--red); }
  button.secondary { background: #fff; color: var(--ink); border: 1px solid #c9c3b6; }
  .meter { height: 12px; background: #ddd6c8; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .meter > div { height: 100%; width: 0; background: var(--green); transition: width .08s; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; border: 1px solid #e3ddd0; }
  .rec { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .hidden { display: none; }
  progress { width: 100%; height: 14px; }
</style>
</head>
<body>
<main>
  <h1><img src="logo.png" alt="" width="56" height="56">TalkCraft</h1>
  <p id="intro" data-t="intro"></p>

  <section id="setup">
    <label for="name" data-t="name"></label>
    <input id="name" autocomplete="name" data-tp="name_hint">
    <label for="mic" data-t="mic"></label>
    <select id="mic"><option data-t="mic_allow"></option></select>
    <div class="meter"><div id="level"></div></div>
    <p class="muted" data-th="headphones"></p>
    <div class="card hidden" id="mobile">
      <b data-t="phone_title"></b>
      <ul class="muted" style="margin:6px 0 0; padding-left:20px">
        <li data-t="phone_1"></li>
        <li data-t="phone_2"></li>
        <li data-t="phone_3"></li>
        <li data-t="phone_4"></li>
      </ul>
    </div>
    <button id="join" disabled data-t="join"></button>
  </section>

  <section id="call" class="hidden">
    <div class="card">
      <p id="state" data-t="connecting"></p>
      <p class="muted hidden" id="warn" style="color: var(--red)"></p>
      <div class="meter"><div id="level2"></div></div>
    </div>
    <div class="card hidden" id="upload">
      <p id="uploadText"></p>
      <progress id="uploadBar" max="1" value="0"></progress>
    </div>
    <button id="selfmute" data-t="mute"></button>
    <button class="secondary" id="save" data-t="save"></button>
    <button class="secondary" id="leave" data-t="leave"></button>
  </section>
  <p class="muted" id="foot" data-t="foot"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
// English unless the browser prefers German; ?lang=de|en forces one.
const TEXT = {
  en: {
    intro: "You are invited to a podcast recording. Your voice is recorded here in your browser in full quality and sent to the studio automatically at the end.",
    name: "Your name", name_hint: "e.g. Anna", mic: "Microphone", mic_allow: "Please allow the microphone …", mic_default: "Microphone",
    headphones: "Please put on <b>headphones</b>, otherwise your microphone picks up the conversation. Say something to test – the bar should clearly move.",
    phone_title: "Recording on a phone",
    phone_1: "Use wired headphones: with Bluetooth headphones the microphone sounds much worse.",
    phone_2: "Keep this page in front while recording and do not switch to other apps.",
    phone_3: "Turn on Do Not Disturb so no call interrupts the recording.",
    phone_4: "Ideally plugged in and on Wi-Fi.",
    join: "Connect", connecting: "Connecting …", mute: "Mute", unmute: "Unmute",
    save: "Also save the recordings on this device", leave: "Leave",
    foot: "The connection runs directly between the browsers. TalkCraft is open source.",
    no_room: "This link is incomplete: the room after the # is missing. Please open the complete link from your invitation.",
    no_mic: "This does not work without the microphone. Please allow it in your browser and reload the page.",
    background: "The page was in the background while recording – the recording may have gaps. Please keep it in front.",
    sending: (n) => `Sending recording ${n} …`, sent: (n) => `Recording ${n} sent ✓`,
    recording: "Recording – just talk normally.", paused: "Connected. Recording paused.",
    studio_muted: "The studio has muted you.", unmuted: "Connected. You can be heard again.",
    self_muted: "You are muted – nobody hears you, your recording records silence.",
    kicked: "The studio has ended the call for you. Thanks for taking part!",
    hello: (host, name) => `Connected to ${host} as ${name}. Waiting for the recording to start …`,
    tap: "Tap the page once to hear the studio.", ended: "Call ended. Thanks for taking part!",
    error: (t) => `Connection error: ${t}. Please reload the page.`,
    none_yet: "No finished recording yet.", guest: "Guest", file: "TalkCraft-Guest",
  },
  de: {
    intro: "Du bist zu einer Podcast-Aufnahme eingeladen. Deine Stimme wird hier im Browser in voller Qualität aufgenommen und am Ende automatisch ans Studio geschickt.",
    name: "Dein Name", name_hint: "z. B. Anna", mic: "Mikrofon", mic_allow: "Bitte Mikrofon erlauben …", mic_default: "Mikrofon",
    headphones: "Bitte <b>Kopfhörer</b> aufsetzen, sonst hört dein Mikrofon das Gespräch mit. Sprich zum Testen – der Balken sollte sich deutlich bewegen.",
    phone_title: "Aufnahme mit dem Handy",
    phone_1: "Kopfhörer mit Kabel nehmen: Bei Bluetooth-Kopfhörern klingt das Mikrofon deutlich schlechter.",
    phone_2: "Diese Seite während der Aufnahme im Vordergrund lassen und nicht in andere Apps wechseln.",
    phone_3: "„Nicht stören“ einschalten, damit kein Anruf die Aufnahme unterbricht.",
    phone_4: "Am besten mit Ladekabel und im WLAN.",
    join: "Verbinden", connecting: "Verbinde …", mute: "Stummschalten", unmute: "Stummschaltung aufheben",
    save: "Aufnahmen zusätzlich auf diesem Gerät speichern", leave: "Verlassen",
    foot: "Die Verbindung läuft direkt zwischen den Browsern. TalkCraft ist Open Source.",
    no_room: "Dieser Link ist unvollständig: Es fehlt die Raum-Kennung hinter dem #. Bitte den vollständigen Link aus der Einladung öffnen.",
    no_mic: "Ohne Mikrofon-Freigabe geht es nicht. Bitte im Browser das Mikrofon erlauben und die Seite neu laden.",
    background: "Die Seite war während der Aufnahme im Hintergrund – dabei kann die Aufnahme Lücken bekommen. Bitte im Vordergrund lassen.",
    sending: (n) => `Aufnahme ${n} wird übertragen …`, sent: (n) => `Aufnahme ${n} übertragen ✓`,
    recording: "Aufnahme läuft – sprich ganz normal.", paused: "Verbunden. Aufnahme pausiert.",
    studio_muted: "Das Studio hat dich stummgeschaltet.", unmuted: "Verbunden. Du bist wieder zu hören.",
    self_muted: "Du bist stummgeschaltet – niemand hört dich, deine Aufnahme zeichnet Stille auf.",
    kicked: "Das Studio hat das Gespräch für dich beendet. Danke fürs Mitmachen!",
    hello: (host, name) => `Verbunden mit ${host} als ${name}. Wartet auf den Start der Aufnahme …`,
    tap: "Tippe einmal auf die Seite, um das Studio zu hören.", ended: "Verbindung beendet. Danke fürs Mitmachen!",
    error: (t) => `Verbindungsfehler: ${t}. Bitte Seite neu laden.`,
    none_yet: "Noch keine fertige Aufnahme.", guest: "Gast", file: "TalkCraft-Gast",
  },
};
const LANG = [new URLSearchParams(location.search).get("lang"), ...(navigator.languages || []), navigator.language]
  .filter(Boolean).map((l) => l.slice(0, 2).toLowerCase()).find((l) => l in TEXT) || "en";
const T = TEXT[LANG];
document.documentElement.lang = LANG;
for (const el of document.querySelectorAll("[data-t]")) el.textContent = T[el.dataset.t];
for (const el of document.querySelectorAll("[data-th]")) el.innerHTML = T[el.dataset.th];
for (const el of document.querySelectorAll("[data-tp]")) el.placeholder = T[el.dataset.tp];

const room = decodeURIComponent((location.hash || "").slice(1));
const $ = (id) => document.getElementById(id);
const CHUNK = 64 * 1024;
let stream, ctx, analyser, peer, conn, call, recorder = null, takes = [], muted = false, kicked = false;
let selfMuted = false, callStream = null, myName = "";
let wakeLock = null, sending = 0, wasHidden = false, player = null;
const mobile = matchMedia("(pointer: coarse)").matches || /iPhone|iPad|Android/i.test(navigator.userAgent);
if (mobile) $("mobile").classList.remove("hidden");

// Phones stop the microphone when the screen locks: keep it on while connected.
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } }
  catch { /* not supported or refused: the hint above has to do */ }
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") { if (recorder) wasHidden = true; return; }
  if (conn) keepAwake();
  if (ctx && ctx.state !== "running") ctx.resume();
  if (wasHidden) {
    $("warn").textContent = T.background;
    $("warn").classList.remove("hidden");
    wasHidden = false;
  }
});
window.addEventListener("beforeunload", (e) => { if (recorder || sending) { e.preventDefault(); e.returnValue = ""; } });

if (!room) {
  $("intro").textContent = T.no_room;
  $("setup").classList.add("hidden");
}

// Capture: raw PCM through an AudioWorklet, so the take is lossless (no browser compression).
// Converted to 16 bit right away: half the memory, which matters on phones (1 h ≈ 350 MB).
const WORKLET = `class Tap extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0][0];
    if (ch) {
      const out = new Int16Array(ch.length);
      for (let i = 0; i < ch.length; i++) out[i] = Math.max(-1, Math.min(1, ch[i])) * 0x7fff;
      this.port.postMessage(out, [out.buffer]);
    }
    return true;
  }
}
registerProcessor("tap", Tap);`;

async function openMic(deviceId) {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({
    audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
  });
  if (!ctx) {
    ctx = new AudioContext({ sampleRate: 48000 });
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  }
  const src = ctx.createMediaStreamSource(stream);
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  src.connect(analyser);
  const tap = new AudioWorkletNode(ctx, "tap");
  // Muted by the guest: silence of the same length, so the take stays in time.
  tap.port.onmessage = (e) => { if (recorder) recorder.push(selfMuted ? new Int16Array(e.data.length) : e.data); };
  src.connect(tap);
  const sink = ctx.createGain();
  sink.gain.value = 0;
  tap.connect(sink).connect(ctx.destination);
}

function meter() {
  if (analyser) {
    const buf = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(buf);
    let peak = 0;
    for (const v of buf) peak = Math.max(peak, Math.abs(v));
    if (selfMuted) peak = 0;
    const pct = Math.max(0, Math.min(100, (20 * Math.log10(peak + 1e-6) + 60) / 60 * 100));
    $("level").style.width = $("level2").style.width = pct + "%";
    if (conn && conn.open && Math.random() < 0.2) conn.send({ t: "level", db: 20 * Math.log10(peak + 1e-6) });
  }
  requestAnimationFrame(meter);
}

async function listMics() {
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === "audioinput");
  $("mic").innerHTML = devs.map((d) => `<option value="${d.deviceId}">${(d.label || T.mic_default).replace(/[<&]/g, "")}</option>`).join("");
}

async function init() {
  try {
    await openMic();
    await listMics();
    $("join").disabled = false;
    meter();
  } catch (e) {
    $("intro").textContent = T.no_mic + " (" + e.message + ")";
  }
}
$("mic").onchange = () => openMic($("mic").value);
$("name").value = localStorage.getItem("tc-name") || "";

function wav(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
  const bytes = new Uint8Array(buf);
  let o = 44;
  for (const c of chunks) { bytes.set(new Uint8Array(c.buffer, c.byteOffset, c.byteLength), o); o += c.byteLength; }
  return buf;
}

async function sendFile(take, buf) {
  sending++;
  try { await sendChunks(take, buf); } finally { sending--; }
}

async function sendChunks(take, buf) {
  $("upload").classList.remove("hidden");
  $("uploadText").textContent = T.sending(take);
  conn.send({ t: "file-begin", take, bytes: buf.byteLength, rate: ctx.sampleRate });
  const dc = conn.dataChannel;
  for (let o = 0; o < buf.byteLength; o += CHUNK) {
    while (dc && dc.bufferedAmount > 4 * 1024 * 1024) await new Promise((r) => setTimeout(r, 30));
    conn.send(buf.slice(o, o + CHUNK));
    $("uploadBar").value = o / buf.byteLength;
  }
  conn.send({ t: "file-end", take });
  $("uploadBar").value = 1;
  $("uploadText").textContent = T.sent(take);
}

function onMessage(m) {
  if (m.t === "start") {
    recorder = [];
    $("state").innerHTML = '<span class="rec"></span>';
    $("state").append(T.recording);
  } else if (m.t === "stop") {
    const chunks = recorder || [];
    recorder = null;
    $("state").textContent = T.paused;
    const buf = wav(chunks, ctx.sampleRate);
    takes.push({ take: m.take, buf });
    sendFile(m.take, buf);
  } else if (m.t === "muted") {
    muted = m.on; // The call is muted in the studio; the own recording keeps running.
    $("state").textContent = m.on ? T.studio_muted : (recorder ? T.recording : T.unmuted);
  } else if (m.t === "kick") {
    kicked = true;
    $("state").textContent = T.kicked;
  } else if (m.t === "hello") {
    // The studio may add a number when two guests share a name.
    $("state").textContent = T.hello(m.host || "TalkCraft", m.name || myName);
  }
}

$("join").onclick = () => {
  const name = $("name").value.trim().slice(0, 60) || T.guest;
  myName = name;
  localStorage.setItem("tc-name", name);
  $("setup").classList.add("hidden");
  $("call").classList.remove("hidden");
  ctx.resume();
  keepAwake();
  // iPhones only play sound that was started by a tap: start the player now, the call joins later.
  player = new Audio();
  player.playsInline = true;
  player.play().catch(() => {});
  peer = new Peer();
  peer.on("open", () => {
    conn = peer.connect(room, { reliable: true, serialization: "binary", metadata: { name } });
    conn.on("open", () => {
      conn.send({ t: "hello", name });
      // The call gets its own copy of the microphone, so muting it never touches the meter.
      callStream = stream.clone();
      callStream.getAudioTracks().forEach((t) => { t.enabled = !selfMuted; });
      call = peer.call(room, callStream, { metadata: { name } });
      call.on("stream", (remote) => {
        player.srcObject = remote;
        player.play().catch(() => { $("state").textContent = T.tap; });
      });
    });
    conn.on("data", (d) => { if (d && d.t) onMessage(d); });
    conn.on("close", () => { if (!kicked) $("state").textContent = T.ended; });
  });
  peer.on("error", (e) => { $("state").textContent = T.error(e.type); });
};

function setSelfMute(on) {
  selfMuted = on;
  if (callStream) callStream.getAudioTracks().forEach((t) => { t.enabled = !on; });
  // Also take the microphone off the connection itself, so nothing at all is sent.
  const pc = call && call.peerConnection;
  const track = callStream && callStream.getAudioTracks()[0];
  if (pc && track) for (const sender of pc.getSenders()) {
    if (!sender.track || sender.track.kind === "audio") sender.replaceTrack(on ? null : track).catch(() => {});
  }
  $("selfmute").textContent = on ? T.unmute : T.mute;
  $("selfmute").classList.toggle("muted-on", on);
  $("level2").parentElement.style.opacity = on ? 0.3 : 1;
  $("state").textContent = on ? T.self_muted : (recorder ? T.recording : T.unmuted);
  if (conn && conn.open) conn.send({ t: "self-mute", on });
}
$("selfmute").onclick = () => setSelfMute(!selfMuted);

$("save").onclick = () => {
  for (const { take, buf } of takes) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
    a.download = `${T.file}-${take}.wav`;
    a.click();
  }
  if (!takes.length) alert(T.none_yet);
};
document.addEventListener("click", () => { if (player && player.paused && player.srcObject) player.play().catch(() => {}); });
$("leave").onclick = () => { if (peer) peer.destroy(); location.reload(); };
init();
</script>
</body>
</html>
