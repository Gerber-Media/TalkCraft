<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkCraft – Studio</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<style>
  :root { --bg: #f4f1ea; --ink: #0b0b0c; --green: #2f9e63; --dim: #6b6b6b; --red: #c0392b; --line: #e3ddd0; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 8px 0 4px; display: flex; align-items: center; gap: 12px; }
  h1 img { width: 56px; height: 56px; border-radius: 12px; }
  .muted { color: var(--dim); font-size: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-top: 16px; border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; }
  input { font: inherit; flex: 1; min-width: 0; padding: 10px 12px; border-radius: 8px; border: 1px solid #c9c3b6; background: #faf8f3; }
  button { font: inherit; padding: 10px 14px; border-radius: 8px; border: 0; background: var(--green); color: #fff; font-weight: 600; cursor: pointer; }
  .guest { display: grid; grid-template-columns: 1fr 120px; gap: 4px 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .guest:first-child { border-top: 0; }
  .meter { height: 10px; background: #ddd6c8; border-radius: 5px; overflow: hidden; align-self: center; }
  .meter > div { height: 100%; width: 0; background: var(--green); }
  .rec { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--red); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<main>
  <h1><img src="logo.png" alt="" width="56" height="56">TalkCraft Studio</h1>
  <p class="muted" data-t="intro"></p>

  <div class="card">
    <b data-t="link"></b>
    <div class="row" style="margin-top:8px">
      <input id="link" readonly>
      <button id="copy" data-t="copy"></button>
    </div>
  </div>

  <div class="card">
    <p id="state" data-t="connecting"></p>
    <div id="guests"></div>
  </div>
  <p class="muted" data-t="foot"></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
// English unless the browser prefers German; ?lang=de|en forces one.
const TEXT = {
  en: {
    intro: "Keep this window open while guests are on. Record with the Record button in TalkCraft – guests start and stop automatically.",
    link: "Invitation link for guests", copy: "Copy", copied: "Copied ✓",
    connecting: "Connecting to the connection service …", none: "No guests yet.",
    foot: "Guests hear you through the microphone this browser uses, and they hear each other. For the recording only your microphone in TalkCraft counts.",
    upload_failed: (g) => `The recording of ${g} could not be handed to TalkCraft.`,
    receiving: (n, pct) => `receiving recording ${n} … ${pct} %`,
    muted: "muted", self_muted: "muted themselves", connected: "connected", audio: "connecting audio …",
    click: "Please click into this page once – there is no sound before that.",
    recording: "Recording", ready: "Ready. Guests can connect now.",
    offline: "TalkCraft cannot be reached – is the app still running?",
    error: (t) => `Connection error: ${t}`, no_mic: "Without the microphone your guests cannot hear you: ",
    guest: "Guest",
  },
  de: {
    intro: "Dieses Fenster offen lassen, solange Gäste zugeschaltet sind. Aufgenommen wird mit dem Record-Knopf in TalkCraft – die Gäste starten und stoppen automatisch mit.",
    link: "Einladungslink für Gäste", copy: "Kopieren", copied: "Kopiert ✓",
    connecting: "Verbinde mit dem Vermittlungsdienst …", none: "Noch keine Gäste.",
    foot: "Gäste hören dich über das Mikrofon, das dieser Browser benutzt, und hören sich gegenseitig. Für die Aufnahme zählt nur dein Mikrofon in TalkCraft.",
    upload_failed: (g) => `Die Aufnahme von ${g} konnte nicht an TalkCraft übergeben werden.`,
    receiving: (n, pct) => `überträgt Aufnahme ${n} … ${pct} %`,
    muted: "stummgeschaltet", self_muted: "hat sich stummgeschaltet", connected: "verbunden", audio: "verbindet Ton …",
    click: "Bitte einmal in diese Seite klicken – vorher läuft kein Ton.",
    recording: "Aufnahme läuft", ready: "Bereit. Gäste können sich jetzt verbinden.",
    offline: "TalkCraft ist nicht erreichbar – läuft die App noch?",
    error: (t) => `Verbindungsfehler: ${t}`, no_mic: "Ohne Mikrofon-Freigabe können dich die Gäste nicht hören: ",
    guest: "Gast",
  },
};
const LANG = [new URLSearchParams(location.search).get("lang"), ...(navigator.languages || []), navigator.language]
  .filter(Boolean).map((l) => l.slice(0, 2).toLowerCase()).find((l) => l in TEXT) || "en";
const T = TEXT[LANG];
document.documentElement.lang = LANG;
for (const el of document.querySelectorAll("[data-t]")) el.textContent = T[el.dataset.t];

const ROOM = "{{ROOM}}";
const TOKEN = "{{TOKEN}}";
const GUEST_URL = "{{GUEST_URL}}";
const $ = (id) => document.getElementById(id);
const api = (path) => `/${TOKEN}/${path}`;
const WORKLET = `class Tap extends AudioWorkletProcessor {
  process(inputs) { const ch = inputs[0][0]; if (ch) this.port.postMessage(ch.slice(0)); return true; }
}
registerProcessor("tap", Tap);`;

$("link").value = `${GUEST_URL}#${ROOM}`;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("link").value); $("copy").textContent = T.copied; }
  catch { $("link").select(); document.execCommand("copy"); }
};

let ctx, micSource, peer;
let recording = false, take = 0, takeStarted = 0;
// peer id → { name, conn, src, dest, tap, live: [chunks] | null, level, file }
const guests = new Map();

// Guests are told apart by name (their track in TalkCraft): a second "Anna" becomes "Anna 2".
function uniqueName(name, id) {
  const base = String(name).trim().slice(0, 60) || T.guest;
  const taken = new Set([...guests].filter(([k]) => k !== id).map(([, g]) => g.name));
  let n = base;
  for (let i = 2; taken.has(n); i++) n = `${base} ${i}`;
  return n;
}

function wav(chunks, rate) {
  const n = chunks.reduce((a, c) => a + c.length, 0);
  const buf = new ArrayBuffer(44 + n * 2);
  const v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE"); str(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); str(36, "data"); v.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of chunks) for (const x of c) { v.setInt16(o, Math.max(-1, Math.min(1, x)) * 0x7fff, true); o += 2; }
  return buf;
}

async function upload(guest, kind, takeNo, started, body) {
  const q = new URLSearchParams({ guest, kind, take: String(takeNo), started: String(started) });
  for (let attempt = 0; attempt < 5; attempt++) {
    try {
      const r = await fetch(api("upload?" + q), { method: "POST", body });
      if (r.ok) return;
    } catch { /* TalkCraft busy or restarting: retry */ }
    await new Promise((r) => setTimeout(r, 1000 * (attempt + 1)));
  }
  alert(T.upload_failed(guest));
}

function render() {
  const el = $("guests");
  if (!guests.size) { el.innerHTML = '<p class="muted"></p>'; el.firstChild.textContent = T.none; return; }
  el.innerHTML = "";
  for (const [id, g] of guests) {
    const row = document.createElement("div");
    row.className = "guest";
    row.innerHTML = `<div><b></b><div class="muted"></div></div><div class="meter"><div id="m-${id}"></div></div>`;
    row.querySelector("b").textContent = g.name;
    row.querySelector(".muted").textContent = g.file ? T.receiving(g.file.take, Math.round(100 * g.file.got / g.file.bytes)) : (g.src ? (g.muted ? T.muted : g.selfMuted ? T.self_muted : T.connected) : T.audio);
    el.appendChild(row);
  }
}

function meters() {
  for (const [id, g] of guests) {
    const bar = document.getElementById("m-" + id);
    const db = g.muted || g.selfMuted ? -60 : (g.level ?? -60);
    if (bar) bar.style.width = Math.max(0, Math.min(100, (db + 60) / 60 * 100)) + "%";
  }
  requestAnimationFrame(meters);
}

// Everyone hears the host and every other guest, but not themselves.
function rewire() {
  for (const [id, g] of guests) {
    if (!g.dest) continue;
    for (const [other, o] of guests) {
      if (other !== id && o.out && !g.hears.has(other)) { o.out.connect(g.dest); g.hears.add(other); }
    }
  }
}

function startLive(g) {
  g.live = [];
  g.liveStarted = Date.now();
}

function stopLive(g, takeNo) {
  if (!g.live) return;
  const chunks = g.live, started = g.liveStarted;
  g.live = null;
  if (chunks.length) upload(g.name, "live", takeNo, started, wav(chunks, ctx.sampleRate));
}

function onData(id, d) {
  const g = guests.get(id);
  if (!g) return;
  if (d instanceof ArrayBuffer || ArrayBuffer.isView(d)) {
    if (!g.file) return;
    const bytes = d instanceof ArrayBuffer ? new Uint8Array(d) : new Uint8Array(d.buffer, d.byteOffset, d.byteLength);
    g.file.parts.push(bytes);
    g.file.got += bytes.byteLength;
    if (g.file.parts.length % 32 === 0) render();
    return;
  }
  if (!d || !d.t) return;
  if (d.t === "hello") {
    g.name = uniqueName(d.name || g.name, id);
    if (g.conn.open) g.conn.send({ t: "hello", host: "TalkCraft", name: g.name });
    render(); report();
  }
  else if (d.t === "level") g.level = d.db;
  else if (d.t === "self-mute") { g.selfMuted = !!d.on; if (g.out) g.out.gain.value = g.muted || g.selfMuted ? 0 : 1; render(); report(); }
  else if (d.t === "file-begin") { g.file = { take: d.take, bytes: d.bytes, got: 0, parts: [], started: g.starts[d.take] ?? Date.now() }; render(); }
  else if (d.t === "file-end" && g.file) {
    const f = g.file;
    g.file = null;
    render();
    upload(g.name, "hq", f.take, f.started, new Blob(f.parts, { type: "audio/wav" }));
  }
}

function addGuest(conn) {
  const g = { name: uniqueName(conn.metadata?.name || T.guest, conn.peer), conn, src: null, out: null, muted: false, dest: null, hears: new Set(), live: null, level: -60, file: null, starts: {} };
  guests.set(conn.peer, g);
  conn.on("open", () => {
    conn.send({ t: "hello", host: "TalkCraft" });
    if (recording) { g.starts[take] = Date.now(); conn.send({ t: "start", take }); startLive(g); }
  });
  conn.on("data", (d) => onData(conn.peer, d));
  conn.on("close", () => {
    stopLive(g, take);
    guests.delete(conn.peer);
    for (const o of guests.values()) o.hears.delete(conn.peer);
    render(); report();
  });
  render();
}

function onCall(call) {
  const g = guests.get(call.peer);
  if (!g) { call.close(); return; }
  g.dest = ctx.createMediaStreamDestination();
  micSource.connect(g.dest);
  call.answer(g.dest.stream);
  call.on("stream", (remote) => {
    // Chrome only feeds a remote WebRTC stream into Web Audio while a media element plays it.
    const keep = new Audio();
    keep.muted = true;
    keep.srcObject = remote;
    keep.play().catch(() => {});
    g.src = ctx.createMediaStreamSource(remote);
    g.out = ctx.createGain();
    g.out.gain.value = g.muted || g.selfMuted ? 0 : 1;
    g.src.connect(g.out);
    g.out.connect(ctx.destination);
    const tap = new AudioWorkletNode(ctx, "tap");
    tap.port.onmessage = (e) => { if (g.live) g.live.push(e.data); };
    g.src.connect(tap);
    const sink = ctx.createGain();
    sink.gain.value = 0;
    tap.connect(sink).connect(ctx.destination);
    rewire();
    render();
  });
}

// Jingles fired in TalkCraft: the guests hear them through the call (the host hears TalkCraft).
let jingleSeq = null;
const jingleCache = new Map();
async function playJingle(pad, file) {
  const key = pad + "|" + file;
  let buf = jingleCache.get(key);
  if (!buf) {
    const r = await fetch(api("jingle/" + pad));
    if (!r.ok) return;
    buf = await ctx.decodeAudioData(await r.arrayBuffer());
    jingleCache.set(key, buf);
  }
  const src = ctx.createBufferSource();
  src.buffer = buf;
  for (const g of guests.values()) if (g.dest) src.connect(g.dest);
  src.start();
}

async function report() {
  const list = [...guests.values()].map((g) => ({ name: g.name, level: g.selfMuted ? -60 : g.level, connected: !!g.src, self_muted: !!g.selfMuted }));
  try { await fetch(api("guests"), { method: "POST", body: JSON.stringify(list) }); } catch { /* TalkCraft closed */ }
}

async function poll() {
  try {
    const s = await (await fetch(api("state"))).json();
    if (s.jingle) {
      if (jingleSeq !== null && s.jingle.seq !== jingleSeq && ctx) playJingle(s.jingle.pad, s.jingle.file).catch(() => {});
      jingleSeq = s.jingle.seq;
    }
    for (const g of guests.values()) {
      const m = (s.muted || []).includes(g.name);
      if (m !== g.muted) {
        g.muted = m;
        if (g.out) g.out.gain.value = m || g.selfMuted ? 0 : 1;
        if (g.conn.open) g.conn.send({ t: "muted", on: m });
        render();
      }
      if ((s.kick || []).includes(g.name) && g.conn.open) {
        g.conn.send({ t: "kick" });
        setTimeout(() => g.conn.close(), 500);
      }
    }
    if (s.recording && !recording) {
      recording = true; take = s.take; takeStarted = Date.now();
      for (const g of guests.values()) { g.starts[take] = takeStarted; startLive(g); if (g.conn.open) g.conn.send({ t: "start", take }); }
    } else if (!s.recording && recording) {
      recording = false;
      for (const g of guests.values()) { if (g.conn.open) g.conn.send({ t: "stop", take }); stopLive(g, take); }
    }
    if (ctx && ctx.state === "suspended") $("state").textContent = T.click;
    else if (recording) { $("state").innerHTML = '<span class="rec"></span>'; $("state").append(T.recording); }
    else if (peer && peer.open) $("state").textContent = T.ready;
  } catch {
    $("state").textContent = T.offline;
  }
  setTimeout(poll, 150);
}

function connectPeer(attempt = 0) {
  peer = new Peer(ROOM);
  peer.on("open", () => { $("state").textContent = T.ready; });
  peer.on("connection", addGuest);
  peer.on("call", onCall);
  peer.on("disconnected", () => { if (!peer.destroyed) peer.reconnect(); });
  peer.on("error", (e) => {
    // After a reload the old session can hold the room a few seconds.
    if (e.type === "unavailable-id" && attempt < 10) { peer.destroy(); setTimeout(() => connectPeer(attempt + 1), 3000); return; }
    $("state").textContent = T.error(e.type);
  });
}

async function init() {
  const mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
  ctx = new AudioContext({ sampleRate: 48000 });
  await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: "text/javascript" })));
  micSource = ctx.createMediaStreamSource(mic);
  render();
  connectPeer();
  poll();
  meters();
  setInterval(report, 1000);
}
render();
document.addEventListener("click", () => ctx && ctx.resume());
init().catch((e) => { $("state").textContent = T.no_mic + e.message; });
</script>
</body>
</html>
