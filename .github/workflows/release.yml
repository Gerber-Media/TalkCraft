# Installers for TalkCraft on GitHub (github.com/Gerber-Media/TalkCraft): macOS (universal DMG),
# Windows (MSI + ZIP) and Linux (AppImage, deb, rpm, tar.gz), built by the packaging scripts in
# packaging/. A tag `v*` publishes them as a GitHub Release; a manual run ("Run workflow") only
# builds them and keeps them as downloadable artifacts of the run.
#
# Signing is optional. Without the secrets the installers are unsigned: macOS blocks the first
# launch (System Settings › Privacy & Security › Open Anyway), Windows SmartScreen warns ("More info › Run anyway").
#   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD,
#            and for notarisation APPLE_ID, APPLE_PASSWORD (app-specific), APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#
# Standard GitHub runners only (free for public repositories).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the version counts the commits since the fork base
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build tools for LAME
        run: brew install autoconf automake libtool
      - name: Signing certificate (skipped without the secret)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: packaging/macos/import-cert.sh
      - name: Package
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@v7
        with:
          name: talkcraft-macos
          path: dist/release/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Package
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./packaging/windows/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: talkcraft-windows
          path: dist/release/*

  linux:
    runs-on: ubuntu-22.04 # glibc 2.35: the binaries also run on newer distributions
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Libraries and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev autoconf automake libtool zsync desktop-file-utils
          curl -sSL -o /tmp/nfpm.deb https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_amd64.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Package
        run: packaging/linux/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: talkcraft-linux
          path: dist/release/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # build provenance (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # Checksums: `shasum -a 256 -c SHA256SUMS.txt` next to the downloads.
      - name: Checksums
        run: cd assets && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Proof that each file was built here from this commit:
      # `gh attestation verify FILE -R Gerber-Media/TalkCraft`.
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: assets/*
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
